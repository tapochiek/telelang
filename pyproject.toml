[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telelang"
version = "0.1.0"
description = "Язык программирования для создания Telegram-ботов и юзерботов"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tele = "telelang.cli.main:main"
